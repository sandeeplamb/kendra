# Release: push a tag such as 1.2.3 or v1.2.3. The tag must match internal/version/VERSION.
# Builds Linux and Windows archives, a universal macOS .pkg, and publishes a GitHub release.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION="$(cat internal/version/VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || { echo "Tag $GITHUB_REF_NAME does not match internal/version/VERSION ($VERSION)"; exit 1; }

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make test

  linux-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build archives
        run: |
          VERSION="$(cat internal/version/VERSION)"
          LDFLAGS="-s -w -X github.com/sandeeplamb/kendra/internal/version.Number=$VERSION"
          mkdir -p dist/stage
          go run packaging/icon.go dist/stage/kendra.png
          for p in linux/amd64 linux/arm64 windows/amd64; do
            os=${p%/*}; arch=${p#*/}; name="Kendra-$VERSION-$os-$arch"; d="dist/stage/$name"; mkdir -p "$d"
            echo "  $os/$arch"
            if [ "$os" = windows ]; then
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "$d/knd.exe" ./cmd/knd
              cp README.md INSTALL.md "$d/"
              (cd dist/stage && zip -qr "../$name.zip" "$name")
            else
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "$d/knd" ./cmd/knd
              cp install.sh README.md INSTALL.md dist/stage/kendra.png "$d/"
              tar -C dist/stage -czf "dist/$name.tar.gz" "$name"
            fi
          done
          rm -rf dist/stage
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: dist/

  # The native window needs cgo and the macOS SDK. The package is unsigned unless the
  # SIGN_APP, SIGN_PKG and NOTARY_PROFILE variables are set up for the runner.
  macos-pkg:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg

  publish:
    needs: [linux-windows, macos-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum Kendra-* > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat internal/version/VERSION)"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Kendra $VERSION" \
            --notes "Kendra $VERSION. See INSTALL.md for the steps. The macOS .pkg is not notarized unless it was built with an Apple Developer ID: right-click it, then Open, the first time."
